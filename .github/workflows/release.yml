name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pillow pymupdf pytesseract
    
    - name: Build executable
      run: |
        python build.py
    
    - name: Get Version Metadata
      id: metadata
      shell: pwsh
      run: |
        $versionInfo = Get-Content version.json | ConvertFrom-Json
        echo "VERSION=$($versionInfo.version)" >> $env:GITHUB_OUTPUT
        echo "SHA256=$($versionInfo.sha256)" >> $env:GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref_name }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./dist/ClasificadorPDF.exe
        asset_name: ClasificadorPDF.exe
        asset_content_type: application/octet-stream

    - name: Prepare version.json for deploy
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path deploy
        Copy-Item version.json -Destination deploy/

    - name: Deploy Information to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy
        publish_branch: gh-pages
        force_orphan: true
