name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Build Executable (Nuitka)
      run: |
        python build.py
    
    - name: Get Version Metadata
      id: metadata
      shell: pwsh
      run: |
        $versionInfo = Get-Content version.json | ConvertFrom-Json
        echo "VERSION=$($versionInfo.version)" >> $env:GITHUB_OUTPUT
        echo "SHA256=$($versionInfo.sha256)" >> $env:GITHUB_OUTPUT

    - name: Release to Public Repo
      uses: softprops/action-gh-release@v1
      with:
        repository: Illioners/ITMQ-DPDF-Release
        token: ${{ secrets.RELEASE_TOKEN }}
        tag_name: v${{ steps.metadata.outputs.VERSION }}
        name: Release v${{ steps.metadata.outputs.VERSION }}
        body_path: RELEASE_NOTES.md
        files: |
          dist/ClasificadorPDF.exe
          version.json
        draft: false
        prerelease: false
